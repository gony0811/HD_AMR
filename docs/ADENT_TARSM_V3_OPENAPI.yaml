# ---------------------------------------------------------------------------
# 아덴트로봇 TARS-M v3 REST API — ACS 재구성 초안 (사내 계약 사본)
#
#  ※ 벤더 공식 산출물이 아니다. 벤더는 문서를 제공하지 않았고(1차 질의 1.1 회신),
#    로봇의 http://<robot>/api/v3 Swagger 화면만 제공된다.
#    이 파일은 아래 자료만으로 ACS 측이 재구성한 초안이며,
#    실물 swagger.json 을 확보하면 그것을 정본으로 삼고 이 파일은 대조용으로 폐기/갱신한다.
#
#  출처
#    - docs/ADENT_VENDOR_INQUIRY.md   1차 질의(2026-08-28) + 벤더 회신(2026-09-01)
#    - docs/ADENT_VENDOR_INQUIRY_2.md 2차 질의(2026-09-01) — 미확인 항목 번호 참조
#    - POST /api/v3/robot/go Swagger 화면 캡처 1장 (필드명 x/y/rz/stopFlag)
#    - Modbus TCP 레지스터 맵 매뉴얼 (REST 외 경로, 참고)
#
#  신뢰도 표기 (각 요소의 x-confidence)
#    CONFIRMED   — 벤더 회신 문언으로 확정. 근거를 x-source 에 기재
#    INFERRED    — 회신/캡처에서 합리적으로 추정. 구현 전 검증 필요
#    UNCONFIRMED — 미확인. x-todo 의 2차 질의 항목 회신 전까지 코드에서 가정하지 말 것
# ---------------------------------------------------------------------------
openapi: 3.0.3

info:
  title: TARS-M v3 REST API (ACS 재구성 초안)
  version: 0.1.0-draft
  description: |
    아덴트로봇 TARS-M AMR 의 v3 REST 인터페이스. HD_AMR 통합 운영 S/W 가 주행 명령·상태 조회에 사용한다.
    HD_ACS 는 이 API 를 직접 호출하지 않는다 — ACS 의 상대는 VDA 5050(MQTT) 하나뿐이며,
    이 문서는 **HD_AMR 온보드 S/W 구현과 벤더 회신 대조를 위한 참조 사양**이다.

    ## 확정된 전역 규약
    - 인증 **없음**, 기본 **80 포트** (1차 1.1 회신)
    - 모든 응답은 공통 envelope: 성공 `{code: 0, data: {}}` / 실패 `{code: N, message: ""}` (1차 2.1 회신)
    - `POST /robot/go` 는 **비동기(명령 수리)**. 완료 판정은 `GET /robot/status` 의 `schedule`,
      실패는 같은 응답의 `error` 로 폴링한다 (1차 2.2/2.3 회신)
    - `POST /robot/go` 는 **대체가 아니라 목적지 큐 추가(append)**.
      진행 중 이동을 멈추고 다른 목적지로 보내려면 **먼저 `POST /robot/state`** 를 호출해야 한다 (1차 2.6/2.7 회신)
    - 좌표는 SLAM 맵 원점 기준, **원점 = 맵 좌측 하단**, `rz` 는 맵 X축 기준 **CCW 라디안** (1차 2.5 회신)

    ## 이 초안의 한계
    엔드포인트 목록 자체가 불완전하다. 여기 실린 3개는 회신·캡처로 존재가 확인된 것뿐이며,
    실제 v3 API 에는 맵/거점/도킹/충전 등 다른 엔드포인트가 있을 것으로 본다(2차 E-5 로 swagger.json 요청 중).
  x-status: DRAFT
  x-generated: "2026-09-01"
  x-owner: HD_ACS
  contact:
    name: 아덴트로봇 (벤더)

servers:
  - url: http://{robotHost}/api/v3
    description: 로봇 온보드 REST 서버 (폐쇄망)
    variables:
      robotHost:
        default: 192.0.2.10
        description: |
          로봇 IP. 실제 값 미확정 — 현장/시험 로봇 주소로 치환할 것.
          포트는 80(기본)이므로 URL 에 표기하지 않는다.

tags:
  - name: robot
    description: 주행 명령 및 상태

paths:
  /robot/go:
    post:
      tags: [robot]
      operationId: robotGo
      summary: 좌표 이동 명령 (비동기 · 큐 추가)
      description: |
        지정 좌표로의 이동 작업을 **큐에 추가**한다. 응답은 **명령 수리**이며 도착을 의미하지 않는다.

        **주의 — 목적지 교체가 아니다.**
        이동 중 이 API 를 다시 호출하면 현재 이동이 대체되지 않고 **다음 목적지로 등록**된다.
        따라서 "지금 가는 곳을 취소하고 다른 곳으로" 는 반드시
        `POST /robot/state`(정지/큐 정리) → `POST /robot/go` 순서로 수행해야 한다.
        이를 지키지 않으면 로봇이 이전 목적지를 먼저 경유하며, 로봇 자체는 정상 동작하므로
        **검사 위치만 틀리는 형태로 조용히 실패**한다.

        진행 상태는 `GET /robot/status` 의 `schedule`, 실패는 `error` 로 확인한다.
      x-confidence: CONFIRMED
      x-source: 1차 질의 2.2/2.4/2.5/2.6 회신 (2026-09-01), Swagger 화면 캡처
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoRequest'
            examples:
              inspectionStop:
                summary: 검사 정차점 (각도 보정 필요 → stopFlag=true)
                value: {x: 12.34, y: 5.67, rz: 1.5708, stopFlag: true}
              waypoint:
                summary: 경유점 (정차 없이 통과 — 현 ACS 계약에서는 미사용)
                value: {x: 3.0, y: 2.0, rz: 0.0, stopFlag: false}
      responses:
        '200':
          description: |
            명령 수리 여부. HTTP 상태코드가 아니라 **body 의 `code` 로 성공/실패를 판정**한다.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - $ref: '#/components/schemas/ApiError'
              examples:
                ok: {value: {code: 0, data: {}}}
                fail: {value: {code: 1001, message: "실패 사유 문자열"}}
      x-todo:
        - "2차 B-3 — 실패 code 값 목록·의미 (로봇 에러코드와 같은 체계인지)"
        - "2차 C-2 — 큐 최대 길이 및 초과 시 동작"
        - "2차 B-5 — stopFlag=true 시 통상 정차 오차(위치 m / 각도 rad)"

  /robot/status:
    get:
      tags: [robot]
      operationId: robotStatus
      summary: 로봇 상태 조회 (이동 완료·실패 판정 경로)
      description: |
        `/robot/go` 의 진행/완료는 `data.schedule`, 실패는 `data.error` 로 확인한다(1차 2.2/2.3 회신).
        **응답 전체 스키마는 미확보** — 아래 `RobotStatus` 는 회신에 언급된 두 필드만 담은 골격이며,
        실제 응답에는 위치·배터리·모드 등 다른 필드가 더 있을 것으로 본다.
      x-confidence: INFERRED
      x-source: 1차 질의 2.2/2.3 회신 (필드명 schedule/error 만 확정, 값·형태 미확정)
      responses:
        '200':
          description: 현재 상태
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotStatus'
      x-todo:
        - "2차 B-2 — 응답 전체 필드 목록, schedule 값 목록(이동 중/도착/큐 비었음 구분), error 형태 및 자동 해소 여부"
        - "2차 B-4 — stopFlag=true 의 '도착'이 각도 보정 완료 시점인지 위치 도달 시점인지"
        - "2차 C-3 — 큐에 남은 목적지 목록·개수 조회 가능 여부"
        - "2차 E-1 — 권장 폴링 주기 및 rate limit (ACS 검토값 200~500 ms)"

  /robot/state:
    post:
      tags: [robot]
      operationId: robotState
      summary: 주행 상태 제어 (정지 · 목적지 교체의 선행 호출)
      description: |
        진행 중 이동의 중지에 사용한다(1차 2.7 회신 — "api/v3 문서 예제 참고").
        REST 단독으로 정지가 가능하므로 **Modbus 주행 정지(Holding 12) 의존을 제거할 수 있다**.

        **요청 body 사양 미확보.** 아래 스키마는 자리표시자이며, 다음이 확인되기 전에는
        코드에서 특정 필드명을 가정하지 말 것:
        정지와 큐 전체 삭제가 구분되는지, 정지 후 재개가 가능한지, 정지 완료(감속 완료) 확인 방법.
      x-confidence: UNCONFIRMED
      x-source: 1차 질의 2.6/2.7 회신 (엔드포인트 존재만 확정, 파라미터 미제공)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateRequest'
      responses:
        '200':
          description: 처리 결과 (공통 envelope)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - $ref: '#/components/schemas/ApiError'
      x-todo:
        - "2차 C-1 — body 전체 사양, 정지 vs 큐 삭제 구분, 재개 가능 여부, 정지 완료 확인 방법"
        - "2차 C-4 — 소프트 정지와 하드웨어 비상정지의 관계, 정지 중 /go 발행 시 동작"

components:
  schemas:

    ApiOk:
      type: object
      description: 성공 응답 envelope (1차 2.1 회신)
      x-confidence: CONFIRMED
      required: [code]
      properties:
        code:
          type: integer
          enum: [0]
          description: 성공은 항상 0
        data:
          type: object
          description: 엔드포인트별 payload. 없으면 빈 객체
          additionalProperties: true

    ApiError:
      type: object
      description: 실패 응답 envelope (1차 2.1 회신)
      x-confidence: CONFIRMED
      required: [code, message]
      properties:
        code:
          type: integer
          description: |
            0 이 아닌 실패 코드. **값 목록 미확보** —
            로봇 에러코드(Modbus Input 11)와 같은 체계인지도 미확인 (2차 B-1/B-3).
          x-confidence: UNCONFIRMED
        message:
          type: string
          description: 실패 사유 문자열

    GoRequest:
      type: object
      description: |
        이동 목적지. 좌표계는 SLAM 맵 원점 기준이며 **원점은 맵 좌측 하단**,
        `rz` 는 맵 X축 기준 CCW 라디안이다 (1차 2.5 회신).

        층 운용은 층별 맵 4장을 타일 배치한 **통합맵** 위에서 이루어지므로,
        여기 실리는 좌표는 **통합맵 좌표**다. 층별 좌표 → 통합맵 좌표 오프셋 변환은
        HD_AMR 온보드 S/W 책임이며 ACS 의 VDA 5050 계약(층별 mapId·층별 좌표)은 그대로 유지된다.
      x-confidence: CONFIRMED
      x-source: Swagger 화면 캡처(필드명) + 1차 2.4/2.5 회신(의미)
      required: [x, y, rz, stopFlag]
      properties:
        x:
          type: number
          format: double
          description: 목적지 X [m] (맵 원점 = 좌측 하단 기준)
          example: 12.34
        y:
          type: number
          format: double
          description: 목적지 Y [m]
          example: 5.67
        rz:
          type: number
          format: double
          description: 목적지 방위각 [rad], 맵 X축 기준 CCW. `stopFlag=false` 면 보정되지 않는다.
          example: 1.5708
        stopFlag:
          type: boolean
          description: |
            - `true`  — 해당 지점에 **정차하고 각도(rz)까지 보정**
            - `false` — 해당 지점 **근처에서 정차하고 바로 다음 목적지로 이동**

            검사 정차점은 코봇 정렬 전제(노드 theta = 벽 정면, VDA 사양서 §4.4)가 있으므로
            **항상 `true`** 로 발행한다. `false` 는 경유점 전용이며 현 ACS 계약에 경유점 개념이 없다.
          x-confidence: CONFIRMED
          x-source: 1차 2.4 회신
          example: true
      additionalProperties: true
      x-note: |
        additionalProperties=true 로 둔 이유 — Swagger 캡처 1장으로 확인한 필드가 4개일 뿐,
        속도·허용오차 등 선택 파라미터가 더 있을 수 있다 (2차 E-5 swagger.json 확보 시 확정).

    RobotStatus:
      type: object
      description: |
        `GET /robot/status` 의 `data`. **회신에 언급된 2개 필드만** 담은 골격이며 실제 응답은 더 넓다.
      x-confidence: INFERRED
      properties:
        schedule:
          description: |
            이동 작업(큐) 진행 상태. **값 목록·자료형 미확정** (2차 B-2).
            ACS/온보드 구현이 판정해야 하는 것: 이동 중 / 도착 완료 / 큐 비었음.
          x-confidence: UNCONFIRMED
          x-todo: "2차 B-2 — 값 목록과 각 의미, 자료형(문자열 enum? 객체?)"
        error:
          description: |
            현재 오류 상태. **형태 미확정**(단일 코드인지 배열인지), 해소 시 자동으로 비워지는지도 미확인 (2차 B-2).
            VDA 5050 errorType(`drivingFailed` / `localizationLost` / `equipmentError` / `emergencyStopActive`)
            매핑 테이블이 이 값 목록에 의존한다 (2차 B-1).
          x-confidence: UNCONFIRMED
          x-todo: "2차 B-1/B-2 — 에러코드 전체 목록과 error 필드 형태"
      additionalProperties: true

    StateRequest:
      type: object
      description: |
        **자리표시자.** `POST /robot/state` 의 실제 body 사양은 미확보다(2차 C-1).
        벤더 회신은 "api/v3 문서(Swagger)의 예제 참고" 이므로, 로봇 Swagger 화면에서
        예제 body 를 확보해 이 스키마를 실제 필드로 교체할 것.
      x-confidence: UNCONFIRMED
      additionalProperties: true
      x-todo: "로봇 /api/v3 Swagger 의 /robot/state 예제 body 캡처 후 교체"

x-unknown-endpoints:
  description: |
    존재가 예상되나 확인되지 않은 영역. 2차 E-5(swagger.json) 회신으로 일괄 확정한다.
  candidates:
    - "맵 관리 — 맵 목록·활성 맵 전환 (2차 D-5), 적재된 맵의 식별자/버전 조회 (2차 D-4)"
    - "거점(node) 관리 — 통합맵 위 거점 조회·등록·좌표 수정 (2차 D-2)"
    - "재측위(PoseSearch) — REST 경로 존재 여부 (2차 A-5). 현재 확인된 경로는 Modbus Holding 20~26 뿐"
    - "도킹·충전·조그 등 운영 명령 (Modbus WorkStatus Input 64 에 대응하는 REST 경로, 2차 E-2)"
